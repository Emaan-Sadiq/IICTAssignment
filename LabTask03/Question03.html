<html>
<head>
<title> Question 01
</title>
</head>
<body style="background-color:white;">

    <div style="background-color:lightgray; width:fit-content; margin:auto; padding:20px 30px 30px 30px;">

        <h2 style="text-align:center; color:red; padding-top:15px;">
            Continental Hotel Reservation Form
        </h2>

        <table style="background-color:lightskyblue; border:2px solid black; margin:auto" cellpadding="8" cellspacing="3" border="1" ;>
            <tr>
                <td style="text-align:right; font-weight:bold;">Name</td>
                <td><input type="text" name="name" value="Enter your name"></td>
            </tr>

            <tr>
                <td style="text-align:right; font-weight:bold;">eMail</td>
                <td><input type="text" name="email" value="info@continental.pk"></td>
            </tr>

            <tr>
                <td style="text-align:right; font-weight:bold;">Mobile No</td>
                <td><input type="text" name="number" value="Enter your cell number"></td>
            </tr>

            <tr>
                <td style="text-align:right; font-weight:bold;">Arrival Time</td>
                <td><input type="time" name="arrival" value="Enter your arrival time"></td>
            </tr>

            <tr>
                <td style="text-align:right; font-weight:bold;">Departure</td>
                <td><input type="date" name="dep1" style="float:left; margin-right:2px;"><input type="time" name="departure" style="float:right;"></td>
            </tr>

            <tr>
                <td style="text-align:right; font-weight:bold;">Room type</td>
                <td>
                    <input type="radio" name="room" value="single" />Single
                    <input type="radio" name="room" value="double" />Double
                    <br />
                    <input type="radio" name="room" value="pres" />Presidential Suite
                </td>
            </tr>
            <tr>
                <td style="text-align:right; font-weight:bold;">Preferences</td>
                <td>
                    <input type="checkbox" name="pref" />Non-smoking
                    <br />
                    <input type="checkbox" name="int" />Internet
                    <br />
                    <input type="checkbox" name="mattress" />Firm Mattress
                    <br />
                </td>
            </tr>

            <tr>
                <td style="text-align:right; font-weight:bold;">Mode Of Payment</td>
                <td>
                    <input type="checkbox" name="cash" />Cash
                    <input type="checkbox" name="check" />Check
                    <br />
                    <input type="checkbox" name="card" />Card
                    <select name="card">
                        <option>Select Card</option>
                        <option>Visa</option>
                        <option>MasterCard</option>
                        <option>American Express</option>
                    </select>
                </td>
            </tr>


            <tr>
                <td colspan="2" style="text-align:center">
                    <input type="submit" />
                </td>
            </tr>

        </table>

    </div>

</body>
</html>
